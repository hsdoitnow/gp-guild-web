<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GP길드 PK 팀 생성기</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#e6eaf2;background:#101521}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 5px}small,.muted{color:#a9b5ca}nav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}button{cursor:pointer;background:#34435b;color:white;border:1px solid #55647d;border-radius:8px;padding:10px 14px;font:inherit}button:hover{filter:brightness(1.18)}button.primary{background:#2469d3;border-color:#377fea}input,select{background:#1d283a;color:white;border:1px solid #50617a;border-radius:7px;padding:9px;min-width:0}input[type=number]{width:74px}input[type=checkbox],input[type=radio]{accent-color:#4b91ff}section,.panel{background:#192235;border:1px solid #33425a;border-radius:12px;padding:18px;margin-bottom:14px}.hidden{display:none}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player{border:1px solid #384b68;padding:12px;border-radius:10px}.player .name{width:75%}.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.role{display:flex;align-items:center;gap:4px;font-size:13px}.role select{width:75px;padding:5px}.result{white-space:pre-wrap;background:#0d1727;border-radius:9px;padding:16px;line-height:1.9;overflow:auto}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border-bottom:1px solid #34435b;padding:10px;text-align:left}th{color:#a9b5ca} .scroll{overflow:auto}.pill{background:#253e5f;padding:5px 10px;border-radius:99px}#notice{position:fixed;right:16px;bottom:16px;background:#294e78;padding:14px;border-radius:10px;display:none;max-width:90vw;z-index:10}@media(max-width:750px){main{padding:12px}.players{grid-template-columns:1fr}.role{font-size:12px}section{padding:12px}button{padding:9px}}
</style></head><body><main><h1>⚔️ GP길드 PK 팀 생성기</h1><small>팀 조합 · 전적 조회 · 길드 랭킹</small><nav><button onclick="tab('team')">팀 생성</button><button onclick="tab('profiles')">프로필 관리</button><button onclick="tab('scores')">점수 설정</button><button onclick="tab('stats')">전적 조회</button><button onclick="tab('ranking')">랭킹</button><button onclick="tab('matches')">경기 기록</button></nav>
<section id="team"><div class="flex"><label><input type="radio" name="mode" value="char"> 캐릭만 나누기 (2명씩)</label><label><input type="radio" name="mode" value="team" checked> 팀까지 짜기 (4vs4)</label></div><div class="flex" style="margin:14px 0"><label><input type="checkbox" id="useDiff" checked> 점수차 제한</label><label>허용 점수차 <input type="number" id="diff" min="0" max="20" value="1"></label><label><input type="checkbox" id="useRecent" checked> 최근 N판 캐릭 제외</label><label>최근 <input type="number" id="recent" min="0" max="5" value="1"> 판</label></div><h3>플레이어 8명</h3><div class="players" id="players"></div><div class="flex" style="margin:16px 0"><button class="primary" onclick="makeTeam()">🎲 조합 생성</button><button onclick="copyResult()">결과 복사 (공지용)</button><button onclick="saveCurrentProfiles()">설정 저장</button><span class="pill" id="genCount">생성 횟수: 0</span></div><div id="result" class="result">플레이어를 입력한 후 조합 생성을 눌러주세요.</div><div id="recordBox" class="panel hidden"><h3>경기 결과 등록</h3><p class="muted">실제로 진행한 경기만 저장하세요. 등록 즉시 모든 길드원 전적에 반영됩니다.</p><div class="flex"><button onclick="recordMatch('A')">🏆 A팀 승리 등록</button><button onclick="recordMatch('B')">🏆 B팀 승리 등록</button></div></div></section>
<section id="profiles" class="hidden"><h2>공용 프로필 관리</h2><p class="muted">누구나 프로필을 수정할 수 있습니다. 이름 선택 시 편집기에 불러옵니다.</p><div class="flex"><select id="profilePick" onchange="loadProfileEditor()"></select><input id="profileName" placeholder="닉네임"><button onclick="saveProfile()">프로필 저장</button><button onclick="deleteProfile()">선택 삭제</button></div><div id="profileRoles" class="roles" style="max-width:550px;margin:20px 0"></div><div class="flex"><button onclick="exportProfiles()">JSON 내보내기</button><button onclick="document.getElementById('importFile').click()">JSON 가져오기</button><input type="file" id="importFile" accept="application/json,.json" class="hidden" onchange="importProfiles(event)"></div></section>
<section id="scores" class="hidden"><h2>캐릭터별 티어 점수</h2><div id="scoreTable" class="scroll"></div><button onclick="saveScores()">점수 설정 저장</button><button onclick="resetScores()">기본값으로 되돌리기</button></section>
<section id="stats" class="hidden"><h2>닉네임별 전적 조회</h2><div class="flex"><input id="searchName" placeholder="정확한 닉네임 입력" onkeydown="if(event.key==='Enter')searchStats()"><button onclick="searchStats()">조회</button></div><div id="statsResult"></div></section>
<section id="ranking" class="hidden"><h2>길드 랭킹</h2><label>최소 경기 수 <input type="number" id="minGames" min="1" value="1" onchange="loadRanking()"></label><div class="scroll" id="rankTable"></div></section>
<section id="matches" class="hidden"><h2>경기 기록 (최신 50경기)</h2><div id="matchList"></div></section>
</main><div id="notice"></div><script>
const roles=['드루이드','어쌔','네크','슴딘'],tiers=['SSS','SS','S','A'];let profiles=[],scores={},last=null,history=[],genCount=0;
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){$('notice').textContent=msg;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',4000)}
async function api(path,opts={}){let r=await fetch('/api'+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
function tab(id){for(const e of document.querySelectorAll('main>section'))e.classList.toggle('hidden',e.id!==id);if(id==='ranking')loadRanking();if(id==='matches')loadMatches()}
function playerHtml(i){return `<div class="player" data-i="${i}"><div class="flex"><b>P${i+1}</b><input class="name" list="names" placeholder="닉네임" onchange="applyProfile(${i})" onblur="applyProfile(${i})"><label><input type="checkbox" class="all" onchange="toggleAll(${i},this.checked)"> ALL</label></div><div class="roles">${roles.map((r,j)=>`<div class="role"><label><input type="checkbox" class="rolecheck" data-role="${esc(r)}" onchange="toggleRole(${i},${j},this.checked)"> ${esc(r)}</label><select class="tier" data-role="${esc(r)}" disabled>${tiers.map(t=>`<option>${t}</option>`).join('')}</select></div>`).join('')}</div></div>`}
function player(i){return document.querySelector(`.player[data-i="${i}"]`)}
function toggleAll(i,on){let el=player(i);el.querySelectorAll('.rolecheck').forEach(c=>c.checked=on);el.querySelectorAll('.tier').forEach(s=>s.disabled=!on)}
function toggleRole(i,j,on){let el=player(i);el.querySelectorAll('.tier')[j].disabled=!on;el.querySelector('.all').checked=[...el.querySelectorAll('.rolecheck')].every(c=>c.checked)}
function applyProfile(i){let el=player(i),name=el.querySelector('.name').value.trim(),p=profiles.find(x=>x.name===name);if(!p)return;el.querySelectorAll('.rolecheck').forEach((c,j)=>{let r=roles[j],on=Object.hasOwn(p.roles,r);c.checked=on;el.querySelectorAll('.tier')[j].disabled=!on;el.querySelectorAll('.tier')[j].value=p.roles[r]||'SSS'});el.querySelector('.all').checked=Object.keys(p.roles).length===4}
function getPlayers(){return Array.from({length:8},(_,i)=>{let el=player(i),name=el.querySelector('.name').value.trim(),r={};el.querySelectorAll('.rolecheck').forEach((c,j)=>{if(c.checked)r[roles[j]]=el.querySelectorAll('.tier')[j].value});return {name,roles:r}})}
async function makeTeam(){try{let data=await api('/generate',{method:'POST',body:JSON.stringify({players:getPlayers(),mode:document.querySelector('[name=mode]:checked').value,use_diff:$('useDiff').checked,diff_limit:Number($('diff').value),use_recent:$('useRecent').checked,recent_n:Number($('recent').value)})});last=data;genCount++;$('genCount').textContent='생성 횟수: '+genCount;renderResult();$('recordBox').classList.toggle('hidden',data.mode!=='team')}catch(e){last=null;$('recordBox').classList.add('hidden');toast(e.message)}}
function renderResult(){if(!last)return;let lines=[];if(last.mode==='char'){lines.push('🎯 캐릭 분배 결과','');for(let r of roles)lines.push(`${r}: ${last.participants.filter(p=>p.role===r).map(p=>`${p.name} (${p.tier}/${p.points}점)`).join(', ')}`)}else{lines.push('🎯 팀 결과',`점수합: A=${last.scores.A} / B=${last.scores.B} (diff=${last.diff})`,'');for(let t of ['A','B']){lines.push(`[팀 ${t}]`);for(let r of roles){let p=last.participants.find(x=>x.team===t&&x.role===r);lines.push(`  ${r}: ${p.name} (${p.tier}/${p.points}점)`)}lines.push('')}}$('result').textContent=lines.join('\n')}
function announce(){if(last.mode==='char')return roles.map(r=>`${r}(${last.participants.filter(p=>p.role===r).map(p=>p.name).join(', ')})`).join(' / ');return ['A','B'].map(t=>`팀[${t}] `+roles.map(r=>`${r==='드루이드'?'드루':r} : ${last.participants.find(p=>p.team===t&&p.role===r).name}`).join(', ')).join('   vs   ')}
async function copyResult(){if(!last)return toast('먼저 조합을 생성하세요.');try{await navigator.clipboard.writeText(announce());history.push(last.assignment);history=history.slice(-10);genCount=0;$('genCount').textContent='생성 횟수: 0';toast('공지용 결과가 복사되었습니다.')}catch(e){toast('복사 실패: HTTPS 접속인지 확인하세요.')}}
async function recordMatch(winner){if(!last||last.mode!=='team')return toast('팀 조합을 먼저 생성하세요.');if(!confirm(`팀 ${winner} 승리로 기록할까요?\n기록은 즉시 모든 길드원에게 반영됩니다.`))return;try{await api('/matches',{method:'POST',body:JSON.stringify({participants:last.participants,winner,scores:last.scores})});toast(`팀 ${winner} 승리 저장 완료`);last=null;$('recordBox').classList.add('hidden');$('result').textContent='경기가 기록되었습니다. 다음 조합을 생성하세요.'}catch(e){toast(e.message)}}
async function fetchProfiles(){profiles=await api('/profiles');$('profilePick').innerHTML='<option value="">프로필 선택</option>'+profiles.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');$('names').innerHTML=profiles.map(p=>`<option value="${esc(p.name)}"></option>`).join('')}
function loadProfileEditor(){let p=profiles.find(x=>x.name===$('profilePick').value);$('profileName').value=p?.name||'';document.querySelectorAll('#profileRoles input[type=checkbox]').forEach(c=>{c.checked=!!p?.roles[c.dataset.role]});document.querySelectorAll('#profileRoles select').forEach(s=>{s.value=p?.roles[s.dataset.role]||'SSS';s.disabled=!p?.roles[s.dataset.role]})}
async function saveProfile(){try{let name=$('profileName').value.trim(),r={};document.querySelectorAll('#profileRoles input[type=checkbox]').forEach(c=>{if(c.checked)r[c.dataset.role]=document.querySelector(`#profileRoles select[data-role="${c.dataset.role}"]`).value});await api('/profiles',{method:'PUT',body:JSON.stringify({name,roles:r})});await fetchProfiles();$('profilePick').value=name;toast('프로필 저장 완료')}catch(e){toast(e.message)}}
async function deleteProfile(){let name=$('profilePick').value;if(!name||!confirm(`${name} 프로필을 삭제할까요? 과거 경기 기록은 유지됩니다.`))return;try{await api('/profiles/'+encodeURIComponent(name),{method:'DELETE'});await fetchProfiles();loadProfileEditor();toast('삭제 완료')}catch(e){toast(e.message)}}
async function saveCurrentProfiles(){let ps=getPlayers().filter(p=>p.name&&Object.keys(p.roles).length);if(new Set(ps.map(p=>p.name)).size!==ps.length)return toast('닉네임이 중복됩니다.');try{for(let p of ps)await api('/profiles',{method:'PUT',body:JSON.stringify(p)});await fetchProfiles();toast(`${ps.length}명 설정 저장 완료`)}catch(e){toast(e.message)}}
function exportProfiles(){let data=Object.fromEntries(profiles.map(p=>[p.name,{roles:p.roles}]));let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gp_profiles.json';a.click();URL.revokeObjectURL(a.href)}
async function importProfiles(ev){let f=ev.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());let out=await api('/profiles/import',{method:'POST',body:JSON.stringify(data)});await fetchProfiles();toast(`${out.count}명 가져오기 완료`)}catch(e){toast(e.message)}ev.target.value=''}
function drawScores(){let html='<table><tr><th>캐릭터</th>'+tiers.map(t=>`<th>${t}</th>`).join('')+'</tr>';for(let r of roles)html+=`<tr><th>${r}</th>`+tiers.map(t=>`<td><input type="number" min="0" max="99" data-r="${r}" data-t="${t}" value="${scores[r][t]}"></td>`).join('')+'</tr>';html+='</table>';$('scoreTable').innerHTML=html}
async function saveScores(){try{let data={};for(let r of roles){data[r]={};for(let t of tiers)data[r][t]=Number(document.querySelector(`#scoreTable input[data-r="${r}"][data-t="${t}"]`).value)}await api('/config/scores',{method:'PUT',body:JSON.stringify({scores:data})});scores=data;toast('점수 저장 완료')}catch(e){toast(e.message)}}
function resetScores(){scores=Object.fromEntries(roles.map(r=>[r,{SSS:6,SS:5,S:4,A:3}]));drawScores()}
function statCard(p){return `<div class="panel"><h3>${esc(p.name)} · 전체 ${p.total}전 ${p.wins}승 ${p.losses}패 (${p.win_rate}%)</h3><div class="scroll"><table><tr><th>캐릭터</th><th>경기</th><th>승</th><th>패</th><th>승률</th></tr>${roles.map(r=>{let s=p.by_role[r]||{total:0,wins:0,losses:0,win_rate:0};return `<tr><td>${r}</td><td>${s.total}</td><td>${s.wins}</td><td>${s.losses}</td><td>${s.total?s.win_rate+'%':'-'}</td></tr>`}).join('')}</table></div></div>`}
async function searchStats(){try{let name=$('searchName').value.trim();if(!name)return toast('닉네임을 입력하세요.');let result=await api('/stats?name='+encodeURIComponent(name));$('statsResult').innerHTML=result.length?statCard(result[0]):'<p>등록된 전적이 없습니다.</p>'}catch(e){toast(e.message)}}
async function loadRanking(){try{let min=Math.max(1,Number($('minGames').value)||1),data=(await api('/stats')).filter(p=>p.total>=min);$('rankTable').innerHTML='<table><tr><th>순위</th><th>닉네임</th><th>전적</th><th>승률</th></tr>'+data.map((p,i)=>`<tr><td>${i+1}</td><td><button onclick="openStats('${encodeURIComponent(p.name)}')">${esc(p.name)}</button></td><td>${p.wins}승 ${p.losses}패</td><td>${p.win_rate}%</td></tr>`).join('')+'</table>'}catch(e){toast(e.message)}}
function openStats(encoded){$('searchName').value=decodeURIComponent(encoded);tab('stats');searchStats()}
async function loadMatches(){try{let ms=await api('/matches?limit=50');$('matchList').innerHTML=ms.length?ms.map(m=>`<div class="panel"><div class="flex space"><b>${esc(new Date(m.created_at).toLocaleString('ko-KR'))}</b><b>🏆 ${m.winner}팀 승리</b></div><div class="players" style="margin-top:12px">${['A','B'].map(t=>`<div><b>팀 ${t} (${m.scores[t]??'-'}점)</b><div>${roles.map(r=>{let p=m.participants.find(x=>x.team===t&&x.role===r);return `<div>${r}: ${esc(p?.name||'-')} (${esc(p?.tier||'-')})</div>`}).join('')}</div></div>`).join('')}</div></div>`).join(''):'<p>아직 등록된 경기가 없습니다.</p>'}catch(e){toast(e.message)}}
async function init(){let cfg=await api('/config');scores=cfg.scores;$('players').innerHTML=Array.from({length:8},(_,i)=>playerHtml(i)).join('');let datalist=document.createElement('datalist');datalist.id='names';document.body.appendChild(datalist);$('profileRoles').innerHTML=roles.map(r=>`<div class="role"><label><input type="checkbox" data-role="${r}" onchange="this.parentElement.nextElementSibling.disabled=!this.checked"> ${r}</label><select data-role="${r}" disabled>${tiers.map(t=>`<option>${t}</option>`).join('')}</select></div>`).join('');drawScores();await fetchProfiles()}
init().catch(e=>toast('서버 연결 실패: '+e.message));
</script></body></html>
